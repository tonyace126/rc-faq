<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>RC 集點平台 客服 QA</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="法國皇家 RC 集點平台 客服常見問題查詢">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23C8102E'/%3E%3Ctext x='50%25' y='58%25' text-anchor='middle' fill='white' font-size='34' font-family='system-ui' font-weight='800'%3ERC%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#F6F7F9;
    --card:#FFFFFF;
    --text:#111827;
    --muted:#6B7280;
    --border:#E5E7EB;
    --border-strong:#D1D5DB;
    --primary:#C8102E;
    --primary-soft:#FEE2E2;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",
      "Noto Sans TC","Helvetica Neue",Arial,sans-serif;
    font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:var(--primary);text-decoration:none}
  a:hover{text-decoration:underline}

  /* ---------- Header ---------- */
  header{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
  .header-inner{max-width:980px;margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
  .brand-logo{width:32px;height:32px;border-radius:8px;background:var(--primary);
    color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
  .brand-sub{color:var(--muted);font-weight:400;font-size:13px}
  .header-meta{margin-left:auto;font-size:12px;color:var(--muted)}

  /* ---------- Search bar ---------- */
  .search-wrap{max-width:980px;margin:18px auto 0;padding:0 20px}
  .search-box{position:relative}
  .search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;color:var(--muted)}
  .search-box input{width:100%;padding:14px 44px 14px 42px;border-radius:12px;
    border:1px solid var(--border-strong);background:#fff;font-size:15px;outline:none;
    transition:border-color .15s, box-shadow .15s}
  .search-box input:focus{border-color:var(--primary);
    box-shadow:0 0 0 3px var(--primary-soft)}
  .kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);
    font-size:11px;color:var(--muted);background:#F3F4F6;padding:2px 6px;border-radius:5px;
    border:1px solid var(--border)}
  @media (max-width:600px){.kbd{display:none}}

  /* ---------- Filter chips ---------- */
  .filters{max-width:980px;margin:14px auto 0;padding:0 20px;
    display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .chip{padding:7px 13px;border-radius:999px;background:#fff;border:1px solid var(--border-strong);
    cursor:pointer;font-size:13px;color:var(--muted);transition:all .15s;user-select:none;
    display:inline-flex;align-items:center;gap:6px}
  .chip:hover{border-color:#9CA3AF;color:var(--text)}
  .chip.active{background:var(--text);color:#fff;border-color:var(--text)}
  .chip-dot{width:8px;height:8px;border-radius:50%}
  .chip-count{font-size:11px;opacity:.6}

  /* ---------- Result summary ---------- */
  .summary{max-width:980px;margin:14px auto 0;padding:0 20px;color:var(--muted);font-size:13px}

  /* ---------- FAQ list ---------- */
  main{max-width:980px;margin:8px auto 60px;padding:0 20px}
  .faq{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden;transition:border-color .15s}
  .faq:hover{border-color:var(--border-strong)}
  .faq-summary{padding:16px 18px;cursor:pointer;list-style:none;display:flex;align-items:flex-start;gap:12px}
  .faq-summary::-webkit-details-marker{display:none}
  .faq[open] .faq-summary{border-bottom:1px solid var(--border)}
  .faq-cat{padding:3px 9px;border-radius:6px;font-size:11px;font-weight:600;color:#fff;flex-shrink:0;margin-top:2px}
  .faq-title{font-size:15px;font-weight:600;flex:1;line-height:1.5}
  .faq-id{font-size:11px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;flex-shrink:0;margin-top:3px}
  .faq-arrow{color:var(--muted);transition:transform .2s;flex-shrink:0;margin-top:2px}
  .faq[open] .faq-arrow{transform:rotate(180deg)}

  .faq-body{padding:6px 18px 18px 18px}
  .field{margin-top:14px}
  .field-label{font-size:12px;font-weight:600;color:var(--muted);
    text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;
    display:flex;align-items:center;gap:6px}
  .field-label-icon{width:14px;height:14px}
  .field-value{font-size:14px;color:var(--text)}
  .field-value ol, .field-value ul{margin:6px 0;padding-left:22px}
  .field-value li{margin:3px 0}

  .reply-box{background:#FFF7ED;border:1px solid #FED7AA;border-radius:10px;
    padding:12px 14px;font-size:14px;line-height:1.7;position:relative;white-space:pre-wrap}
  .copy-btn{position:absolute;top:8px;right:8px;padding:5px 10px;border-radius:6px;
    border:1px solid var(--border-strong);background:#fff;font-size:12px;cursor:pointer;
    color:var(--text);font-family:inherit;display:inline-flex;align-items:center;gap:4px;transition:all .15s}
  .copy-btn:hover{border-color:var(--primary);color:var(--primary)}
  .copy-btn.copied{background:#16A085;color:#fff;border-color:#16A085}

  .tags{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:11px;padding:2px 8px;background:#F3F4F6;border-radius:4px;color:var(--muted)}

  .images{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px}
  .images img{height:90px;border-radius:8px;border:1px solid var(--border);
    cursor:zoom-in;object-fit:cover;transition:transform .15s}
  .images img:hover{transform:scale(1.03)}

  mark{background:#FEF3C7;color:inherit;padding:0 2px;border-radius:2px}

  .updated{font-size:11px;color:var(--muted);margin-top:14px;padding-top:10px;
    border-top:1px dashed var(--border)}

  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty h3{margin:0 0 6px;color:var(--text);font-weight:600}

  /* ---------- Lightbox ---------- */
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;
    align-items:center;justify-content:center;z-index:200;cursor:zoom-out;padding:20px}
  .lb.show{display:flex}
  .lb img{max-width:100%;max-height:100%;border-radius:8px}
  .lb-close{position:fixed;top:18px;right:20px;color:#fff;font-size:32px;cursor:pointer;
    width:40px;height:40px;display:grid;place-items:center;line-height:1;
    border-radius:50%;background:rgba(255,255,255,.1);border:none}

  /* ---------- Footer ---------- */
  footer{max-width:980px;margin:30px auto 40px;padding:0 20px;color:var(--muted);font-size:12px;
    text-align:center;line-height:1.8}
  footer a{color:var(--muted);border-bottom:1px dotted var(--muted)}

  @media (max-width:600px){
    .header-meta{display:none}
    .faq-id{display:none}
    .images img{height:70px}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-logo">RC</div>
      <div>
        客服 QA 查詢
        <div class="brand-sub">RC 集點平台 · LIFF</div>
      </div>
    </div>
    <div class="header-meta" id="meta"></div>
  </div>
</header>

<div class="search-wrap">
  <div class="search-box">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.7" y2="16.7"/>
    </svg>
    <input id="search" type="search" placeholder="搜尋問題、症狀、關鍵字（例如：發票、明細、未收到點數）" autofocus>
    <span class="kbd">/</span>
  </div>
</div>

<div class="filters" id="filters"></div>

<div class="summary" id="summary"></div>

<main id="list"></main>

<footer>
  <div>更新時間：<span id="lastUpdated">—</span> · 資料來源：data/faqs.json</div>
  <div style="margin-top:6px">使用提示：用「<b>/</b>」聚焦搜尋框 · 點分類可篩選 · 截圖點擊可放大 · 「複製話術」可一鍵貼到 LINE</div>
</footer>

<div class="lb" id="lb"><button class="lb-close" id="lbClose" aria-label="關閉">×</button><img id="lbImg" alt=""></div>

<script>
(function(){
  const $ = sel => document.querySelector(sel);
  const escapeHtml = s => String(s||'').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const highlight = (text, q) => {
    if(!q) return escapeHtml(text);
    const escaped = escapeHtml(text);
    const safeQ = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return escaped.replace(new RegExp(safeQ,'gi'), m => `<mark>${m}</mark>`);
  };

  let DATA = null;
  let activeCat = 'all';
  let query = '';

  // ---- 載入資料 ----
  fetch('data/faqs.json?_=' + Date.now())
    .then(r => {
      if(!r.ok) throw new Error('無法載入 data/faqs.json (HTTP ' + r.status + ')');
      return r.json();
    })
    .then(d => { DATA = d; init(); })
    .catch(err => {
      $('#list').innerHTML =
        `<div class="empty"><h3>載入失敗</h3>
         <p>${escapeHtml(err.message)}</p>
         <p style="font-size:12px">請確認此頁是用 http(s):// 開啟，而非直接打開 file://（瀏覽器會擋 fetch）。</p></div>`;
    });

  function init(){
    document.title = DATA.meta.siteTitle || document.title;
    $('#lastUpdated').textContent = DATA.meta.lastUpdated || '—';
    $('#meta').textContent = `共 ${DATA.faqs.length} 筆 · 更新：${DATA.meta.lastUpdated || '—'}`;
    renderFilters();
    render();

    $('#search').addEventListener('input', e => { query = e.target.value.trim(); render(); });
    document.addEventListener('keydown', e => {
      if(e.key === '/' && document.activeElement.tagName !== 'INPUT'){
        e.preventDefault(); $('#search').focus();
      }
      if(e.key === 'Escape') closeLB();
    });
    $('#lb').addEventListener('click', closeLB);
    $('#lbClose').addEventListener('click', e => { e.stopPropagation(); closeLB(); });
  }

  function renderFilters(){
    const counts = {all: DATA.faqs.length};
    DATA.categories.forEach(c => counts[c.id] = 0);
    DATA.faqs.forEach(f => { if(counts[f.category] !== undefined) counts[f.category]++; });

    const html = [`<div class="chip ${activeCat==='all'?'active':''}" data-cat="all">
        全部 <span class="chip-count">${counts.all}</span></div>`];
    DATA.categories.forEach(c => {
      if(counts[c.id] === 0) return;
      html.push(`<div class="chip ${activeCat===c.id?'active':''}" data-cat="${c.id}">
        <span class="chip-dot" style="background:${c.color}"></span>
        ${escapeHtml(c.name)} <span class="chip-count">${counts[c.id]}</span></div>`);
    });
    $('#filters').innerHTML = html.join('');
    $('#filters').querySelectorAll('.chip').forEach(el => {
      el.addEventListener('click', () => {
        activeCat = el.dataset.cat;
        renderFilters();
        render();
      });
    });
  }

  function matches(faq, q){
    if(!q) return true;
    const hay = [
      faq.title, faq.memberSymptom, faq.rootCause, faq.replyTemplate,
      (faq.tags||[]).join(' '), (faq.csSteps||[]).join(' '), faq.id
    ].join(' ').toLowerCase();
    return q.toLowerCase().split(/\s+/).filter(Boolean).every(t => hay.includes(t));
  }

  function render(){
    const cat = DATA.categories.reduce((m,c)=>{m[c.id]=c;return m;},{});
    const filtered = DATA.faqs.filter(f =>
      (activeCat === 'all' || f.category === activeCat) && matches(f, query)
    );

    $('#summary').textContent = query
      ? `找到 ${filtered.length} 筆「${query}」相關 QA`
      : (activeCat === 'all' ? `共 ${filtered.length} 筆 QA` : `${cat[activeCat].name}：${filtered.length} 筆`);

    if(filtered.length === 0){
      $('#list').innerHTML = `<div class="empty"><h3>沒有找到相關問題</h3>
        <p>試試其他關鍵字，或切換分類。</p>
        <p style="font-size:12px">如果這是新問題，請通知 TONY 加進 QA 庫。</p></div>`;
      return;
    }

    $('#list').innerHTML = filtered.map(f => renderFaq(f, cat[f.category])).join('');
    bindCardEvents();
  }

  function renderFaq(f, c){
    const catColor = c ? c.color : '#7F8C8D';
    const catName = c ? c.name : f.category;
    const stepsHtml = (f.csSteps||[]).length
      ? `<ol>${f.csSteps.map(s => `<li>${highlight(s, query)}</li>`).join('')}</ol>`
      : '<i style="color:var(--muted)">（尚未填寫處理步驟）</i>';
    const tagsHtml = (f.tags||[]).length
      ? `<div class="tags">${f.tags.map(t => `<span class="tag">#${escapeHtml(t)}</span>`).join('')}</div>` : '';
    const imagesHtml = (f.images||[]).length
      ? `<div class="images">${f.images.map(src =>
          `<img src="${escapeHtml(src)}" data-full="${escapeHtml(src)}" alt="${escapeHtml(f.title)} 截圖" loading="lazy">`
        ).join('')}</div>` : '';

    return `
    <details class="faq" id="${escapeHtml(f.id)}">
      <summary class="faq-summary">
        <span class="faq-cat" style="background:${catColor}">${escapeHtml(catName)}</span>
        <span class="faq-title">${highlight(f.title, query)}</span>
        <span class="faq-id">${escapeHtml(f.id)}</span>
        <svg class="faq-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"/></svg>
      </summary>
      <div class="faq-body">
        ${f.memberSymptom ? `<div class="field">
          <div class="field-label">會員常見描述</div>
          <div class="field-value">「${highlight(f.memberSymptom, query)}」</div>
        </div>` : ''}

        ${f.rootCause ? `<div class="field">
          <div class="field-label">問題原因</div>
          <div class="field-value">${highlight(f.rootCause, query)}</div>
        </div>` : ''}

        <div class="field">
          <div class="field-label">客服處理 SOP</div>
          <div class="field-value">${stepsHtml}</div>
        </div>

        ${f.replyTemplate ? `<div class="field">
          <div class="field-label">建議回覆話術</div>
          <div class="reply-box" id="reply-${escapeHtml(f.id)}">${escapeHtml(f.replyTemplate)}<button class="copy-btn" data-target="${escapeHtml(f.id)}">📋 複製</button></div>
        </div>` : ''}

        ${imagesHtml ? `<div class="field"><div class="field-label">相關截圖</div>${imagesHtml}</div>` : ''}

        ${tagsHtml}
        <div class="updated">最後更新：${escapeHtml(f.updated || '—')}</div>
      </div>
    </details>`;
  }

  function bindCardEvents(){
    document.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', async e => {
        e.preventDefault(); e.stopPropagation();
        const id = btn.dataset.target;
        const faq = DATA.faqs.find(f => f.id === id);
        if(!faq || !faq.replyTemplate) return;
        try{
          await navigator.clipboard.writeText(faq.replyTemplate);
        }catch{
          const ta = document.createElement('textarea');
          ta.value = faq.replyTemplate; document.body.appendChild(ta);
          ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        }
        btn.classList.add('copied');
        const orig = btn.innerHTML;
        btn.innerHTML = '✓ 已複製';
        setTimeout(()=>{ btn.classList.remove('copied'); btn.innerHTML = orig; }, 1500);
      });
    });
    document.querySelectorAll('.images img').forEach(img => {
      img.addEventListener('click', () => openLB(img.dataset.full));
    });
  }

  function openLB(src){
    $('#lbImg').src = src;
    $('#lb').classList.add('show');
  }
  function closeLB(){
    $('#lb').classList.remove('show');
    $('#lbImg').src = '';
  }
})();
</script>
</body>
</html>
