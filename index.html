<!-- ===== Lock gate (盡早執行避免內容閃現) ===== -->
<style id="lock-gate-style">
  html.locked body > *:not(.lock-screen) { display: none !important; }
  .lock-screen { display: none; }
  html.locked .lock-screen { display: flex !important; }
  .lock-screen{position:fixed;inset:0;background:#F6F7F9;z-index:9999;
    align-items:center;justify-content:center;flex-direction:column;padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC","Helvetica Neue",Arial,sans-serif}
  .lock-card{background:#fff;border:1px solid #E5E7EB;border-radius:14px;
    padding:32px 28px;max-width:380px;width:100%;
    box-shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 28px rgba(0,0,0,.06);text-align:center}
  .lock-logo{width:48px;height:48px;background:#C8102E;color:#fff;border-radius:12px;
    display:grid;place-items:center;font-weight:800;font-size:18px;margin:0 auto 14px}
  .lock-card h2{margin:0 0 6px;font-size:16px;font-weight:700;color:#111827}
  .lock-card .lock-sub{margin:0 0 20px;font-size:12px;color:#6B7280;line-height:1.6}
  .lock-input{width:100%;padding:10px 14px;border:1px solid #D1D5DB;border-radius:8px;
    font-size:14px;font-family:inherit;outline:none;transition:border-color .15s}
  .lock-input:focus{border-color:#C8102E}
  .lock-btn{margin-top:12px;width:100%;padding:10px 14px;border:none;
    background:#C8102E;color:#fff;border-radius:8px;font-size:14px;font-weight:600;
    cursor:pointer;font-family:inherit;transition:background .15s}
  .lock-btn:hover{background:#A50E26}
  .lock-err{margin:10px 0 0;font-size:12px;color:#C8102E;min-height:16px}
</style>
<script>

  try {
    if (localStorage.getItem(AUTH_KEY) === HASH) return;

<style>
  :root{
    --bg:#F6F7F9;
    --card:#FFFFFF;
    --text:#111827;
    --muted:#6B7280;
    --border:#E5E7EB;
    --border-strong:#D1D5DB;
    --primary:#C8102E;
    --primary-soft:#FEE2E2;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",
      "Noto Sans TC","Helvetica Neue",Arial,sans-serif;
    font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:var(--primary);text-decoration:none}
  a:hover{text-decoration:underline}

  /* ---------- Header ---------- */
  header{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
  .header-inner{max-width:1080px;margin:0 auto;padding:14px 20px 0;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
  .brand-logo{width:32px;height:32px;border-radius:8px;background:var(--primary);
    color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
  .brand-sub{color:var(--muted);font-weight:400;font-size:13px}
  .header-meta{margin-left:auto;font-size:12px;color:var(--muted)}

  /* ---------- Quick links bar ---------- */
  .quick-bar{background:linear-gradient(180deg,#FFF7F8 0%,#FFFFFF 100%);
    border-bottom:1px solid var(--border);padding:14px 0 12px}
  .quick-bar-inner{max-width:1080px;margin:0 auto;padding:0 20px;
    display:flex;flex-wrap:wrap;gap:18px 28px;align-items:center}
  .quick-section{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .quick-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1px;
    text-transform:uppercase;flex-shrink:0}
  .quick-divider{width:1px;align-self:stretch;background:var(--border);margin:2px 4px}
  .quick-btn{display:inline-flex;align-items:center;gap:7px;
    padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;
    text-decoration:none;transition:all .15s;line-height:1.2;border:1px solid transparent;
    white-space:nowrap}
  .quick-btn:hover{text-decoration:none;transform:translateY(-1px)}
  .quick-btn.primary{background:var(--primary);color:#fff;
    box-shadow:0 2px 6px rgba(200,16,46,.25)}
  .quick-btn.primary:hover{background:#A50E26;
    box-shadow:0 4px 10px rgba(200,16,46,.35)}
  .quick-btn.event{background:#fff;color:var(--text);border-color:var(--border-strong)}
  .quick-btn.event:hover{border-color:var(--primary);color:var(--primary);
    box-shadow:0 2px 6px rgba(0,0,0,.06)}
  .quick-btn-icon{font-size:14px;line-height:1}
  .quick-btn-meta{display:inline-flex;align-items:center;gap:6px;margin-left:2px}
  .quick-tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;
    font-weight:700;letter-spacing:.3px;line-height:1.4}
  .quick-tag.feature{background:#E0F2FE;color:#0369A1}
  .quick-tag.event{background:#FEF3C7;color:#B45309}
  .quick-tag.expired{background:#F3F4F6;color:#9CA3AF}
  .quick-period{font-size:11px;color:var(--muted);font-weight:400}
  .quick-btn.event.is-expired{opacity:.55}
  .quick-btn.event.is-expired:hover{border-color:var(--border-strong);color:var(--muted);transform:none;box-shadow:none}
  @media(max-width:600px){
    .quick-bar{padding:10px 0 10px}
    .quick-bar-inner{padding:0 14px;gap:10px 16px}
    .quick-label{display:none}
    .quick-divider{display:none}
    .quick-btn{padding:7px 12px;font-size:12px}
    .quick-period{display:none}
  }

  /* ---------- Tabs ---------- */
  .tabs{max-width:1080px;margin:0 auto;padding:14px 20px 0;display:flex;gap:2px;border-bottom:1px solid var(--border)}
  .tab{padding:10px 18px;border:none;background:transparent;font:inherit;font-size:14px;font-weight:600;
    color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
    transition:all .15s;display:inline-flex;align-items:center;gap:6px}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--primary);border-bottom-color:var(--primary)}

  .panel{display:none}
  .panel.active{display:block}

  /* ---------- Search bar ---------- */
  .search-wrap{max-width:1080px;margin:18px auto 0;padding:0 20px}
  .search-box{position:relative}
  .search-box svg.s-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;color:var(--muted)}
  .search-box input{width:100%;padding:14px 44px 14px 42px;border-radius:12px;
    border:1px solid var(--border-strong);background:#fff;font-size:15px;outline:none;
    transition:border-color .15s, box-shadow .15s}
  .search-box input:focus{border-color:var(--primary);
    box-shadow:0 0 0 3px var(--primary-soft)}
  .kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);
    font-size:11px;color:var(--muted);background:#F3F4F6;padding:2px 6px;border-radius:5px;
    border:1px solid var(--border)}
  @media (max-width:600px){.kbd{display:none}}

  /* ---------- Filter chips ---------- */
  .filters{max-width:1080px;margin:14px auto 0;padding:0 20px;
    display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .chip{padding:7px 13px;border-radius:999px;background:#fff;border:1px solid var(--border-strong);
    cursor:pointer;font-size:13px;color:var(--muted);transition:all .15s;user-select:none;
    display:inline-flex;align-items:center;gap:6px}
  .chip:hover{border-color:#9CA3AF;color:var(--text)}
  .chip.active{background:var(--text);color:#fff;border-color:var(--text)}
  .chip-dot{width:8px;height:8px;border-radius:50%}
  .chip-count{font-size:11px;opacity:.6}

  .summary{max-width:1080px;margin:14px auto 0;padding:0 20px;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .summary-spacer{flex:1}

  /* mode toggle for flows */
  .mode-toggle{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden}
  .mode-toggle button{font:inherit;font-size:12px;padding:6px 12px;border:none;background:#fff;cursor:pointer;color:var(--muted)}
  .mode-toggle button.active{background:var(--text);color:#fff}

  /* ---------- FAQ list ---------- */
  main{max-width:1080px;margin:8px auto 60px;padding:0 20px}
  .faq{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden;transition:border-color .15s}
  .faq:hover{border-color:var(--border-strong)}
  .faq.flash-target{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft), var(--shadow)}
  .faq-summary{padding:16px 18px;cursor:pointer;list-style:none;display:flex;align-items:flex-start;gap:12px}
  .faq-summary::-webkit-details-marker{display:none}
  .faq[open] .faq-summary{border-bottom:1px solid var(--border)}
  .faq-cat{padding:3px 9px;border-radius:6px;font-size:11px;font-weight:600;color:#fff;flex-shrink:0;margin-top:2px}
  .faq-title{font-size:15px;font-weight:600;flex:1;line-height:1.5}
  .faq-id{font-size:11px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;flex-shrink:0;margin-top:3px}
  .faq-arrow{color:var(--muted);transition:transform .2s;flex-shrink:0;margin-top:2px}
  .faq[open] .faq-arrow{transform:rotate(180deg)}

  .faq-body{padding:6px 18px 18px 18px}
  .field{margin-top:14px}
  .field-label{font-size:12px;font-weight:600;color:var(--muted);
    text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  .field-value{font-size:14px;color:var(--text)}
  .field-value ol, .field-value ul{margin:6px 0;padding-left:22px}
  .field-value li{margin:3px 0}

  .reply-box{background:#FFF7ED;border:1px solid #FED7AA;border-radius:10px;
    padding:12px 14px;font-size:14px;line-height:1.7;position:relative;white-space:pre-wrap}
  .copy-btn{position:absolute;top:8px;right:8px;padding:5px 10px;border-radius:6px;
    border:1px solid var(--border-strong);background:#fff;font-size:12px;cursor:pointer;
    color:var(--text);font-family:inherit;display:inline-flex;align-items:center;gap:4px;transition:all .15s}
  .copy-btn:hover{border-color:var(--primary);color:var(--primary)}
  .copy-btn.copied{background:#16A085;color:#fff;border-color:#16A085}

  .tags{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:11px;padding:2px 8px;background:#F3F4F6;border-radius:4px;color:var(--muted)}

  .images{margin-top:8px;display:flex;flex-wrap:wrap;gap:8px}
  .images img{height:90px;border-radius:8px;border:1px solid var(--border);
    cursor:zoom-in;object-fit:cover;transition:transform .15s}
  .images img:hover{transform:scale(1.03)}

  mark{background:#FEF3C7;color:inherit;padding:0 2px;border-radius:2px}

  .updated{font-size:11px;color:var(--muted);margin-top:14px;padding-top:10px;
    border-top:1px dashed var(--border)}

  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty h3{margin:0 0 6px;color:var(--text);font-weight:600}

  /* ---------- Flows: 流程模式 ---------- */
  .flows-layout{display:grid;grid-template-columns:280px 1fr;gap:18px;margin-top:12px}
  @media (max-width:760px){.flows-layout{grid-template-columns:1fr}}
  .flow-side{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:8px;
    box-shadow:var(--shadow);height:fit-content;position:sticky;top:120px}
  @media (max-width:760px){.flow-side{position:static}}
  .flow-item{padding:11px 12px;border-radius:8px;cursor:pointer;border:1px solid transparent;transition:all .15s}
  .flow-item:hover{background:#F9FAFB}
  .flow-item.active{background:var(--primary-soft);border-color:#FCA5A5}
  .flow-item-head{display:flex;align-items:center;gap:6px;margin-bottom:3px}
  .flow-cat-badge{font-size:10px;padding:1px 6px;border-radius:4px;color:#fff;font-weight:600}
  .flow-step-count{font-size:10px;color:var(--muted);margin-left:auto;
    font-family:ui-monospace,Menlo,monospace}
  .flow-name{font-size:13px;font-weight:600;line-height:1.4}

  .flow-detail{background:#fff;border:1px solid var(--border);border-radius:var(--radius);
    padding:24px;box-shadow:var(--shadow)}
  .flow-detail-head{padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:18px}
  .flow-detail-head h2{margin:0 0 6px;font-size:18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .flow-detail-head .desc{color:var(--muted);font-size:14px;margin:0}

  .step{display:grid;grid-template-columns:280px 1fr;gap:18px;padding:18px 0;border-top:1px dashed var(--border)}
  .step:first-child{border-top:none;padding-top:0}
  @media (max-width:600px){.step{grid-template-columns:1fr}}
  .step-img{position:relative}
  .step-img img{width:100%;border-radius:10px;border:1px solid var(--border);cursor:zoom-in;
    background:#F3F4F6;object-fit:contain;max-height:340px;transition:transform .15s}
  .step-img img:hover{transform:scale(1.02)}
  .step-img-noimg{aspect-ratio:9/16;background:#F3F4F6;border-radius:10px;border:2px dashed var(--border-strong);
    display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:10px}

  /* Multi-image carousel */
  .step-carousel{position:relative;border-radius:10px;border:1px solid var(--border);
    background:#F3F4F6;overflow:hidden}
  .step-carousel-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .step-carousel-track::-webkit-scrollbar{display:none}
  .step-carousel-slide{flex:0 0 100%;scroll-snap-align:start;display:flex;align-items:center;
    justify-content:center;background:#F3F4F6;min-height:200px}
  .step-carousel-slide img{width:100%;max-height:340px;object-fit:contain;cursor:zoom-in;
    border:none;border-radius:0;display:block;background:#F3F4F6}
  .step-carousel-slide img:hover{transform:none}
  .step-carousel-slide-empty{width:100%;aspect-ratio:9/16;display:grid;place-items:center;
    color:var(--muted);font-size:12px;text-align:center;padding:10px;background:#F3F4F6}
  .step-carousel-counter{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.65);
    color:#fff;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;
    pointer-events:none;opacity:0;transition:opacity .2s;font-family:ui-monospace,Menlo,monospace}
  .step-carousel:hover .step-carousel-counter,
  .step-carousel.has-multi .step-carousel-counter{opacity:1}
  .step-carousel-dots{display:flex;justify-content:center;gap:5px;padding:6px 0 8px;background:#fff;border-top:1px solid var(--border)}
  .step-carousel-dot{width:6px;height:6px;border-radius:50%;background:#D1D5DB;transition:all .15s;cursor:pointer;border:none;padding:0}
  .step-carousel-dot.active{background:var(--primary);width:18px;border-radius:3px}
  .step-carousel-arrow{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;
    border-radius:50%;background:rgba(255,255,255,.9);border:1px solid var(--border-strong);
    display:none;align-items:center;justify-content:center;cursor:pointer;
    font-size:16px;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.1);z-index:2}
  .step-carousel:hover .step-carousel-arrow{display:flex}
  .step-carousel-arrow.prev{left:6px}
  .step-carousel-arrow.next{right:6px}
  .step-carousel-arrow:disabled{opacity:.3;cursor:not-allowed}
  @media (max-width:760px){
    .step-carousel-arrow{display:none !important}
  }
  .step-meta h4{margin:0 0 6px;font-size:15px;line-height:1.45}
  .step-meta p{margin:0;color:var(--muted);font-size:13px;line-height:1.7;white-space:pre-line}
  .step-related{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .step-related-label{font-size:11px;color:var(--muted)}
  .step-related a{font-size:12px;padding:3px 9px;background:var(--primary-soft);
    border-radius:5px;color:var(--primary);text-decoration:none;border:1px solid #FCA5A5;transition:all .15s}
  .step-related a:hover{background:var(--primary);color:#fff;text-decoration:none}

  /* ---------- Flows: 圖庫模式 ---------- */
  .library-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:12px;margin-top:14px}
  .lib-card{background:#fff;border:1px solid var(--border);border-radius:10px;
    overflow:hidden;cursor:pointer;transition:all .15s;display:flex;flex-direction:column}
  .lib-card:hover{border-color:var(--border-strong);transform:translateY(-2px);
    box-shadow:0 4px 12px rgba(0,0,0,.06)}
  .lib-card img{width:100%;aspect-ratio:9/16;object-fit:cover;background:#F3F4F6;display:block}
  .lib-card-meta{padding:8px 10px;font-size:11px}
  .lib-card-flow{color:var(--muted);font-size:10px;margin-bottom:2px;display:flex;align-items:center;gap:4px}
  .lib-card-title{font-weight:600;font-size:12px;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* ---------- Event Panel ---------- */
  #panel-event{max-width:1080px;margin:0 auto;padding:0 20px 40px}
  .event-section-title{font-size:11px;font-weight:700;color:var(--muted);
    letter-spacing:1.2px;text-transform:uppercase;margin:22px 0 10px;padding-top:14px;
    border-top:1px solid var(--border)}
  .event-section-title:first-child{border-top:0;padding-top:18px;margin-top:0}
  .event-empty{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px}

  .event-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden;transition:opacity .2s}
  .event-card[open]{box-shadow:0 2px 6px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.04)}
  .event-card.expired{opacity:.55;background:#FAFAFA}
  .event-card.expired:hover{opacity:.85}
  .event-card-summary{display:flex;align-items:flex-start;gap:16px;padding:18px;
    cursor:pointer;list-style:none;position:relative;transition:background .15s}
  .event-card-summary:hover{background:#FAFAFA}
  .event-card-summary::-webkit-details-marker{display:none}
  .event-card-summary::marker{display:none;content:''}
  .event-card-banner{width:170px;height:auto;max-height:160px;object-fit:cover;
    border-radius:8px;border:1px solid var(--border);flex-shrink:0}
  .event-card-meta{flex:1;min-width:0;padding-right:36px}
  .event-card-toggle{position:absolute;right:16px;top:50%;transform:translateY(-50%);
    width:28px;height:28px;border-radius:50%;background:#F3F4F6;
    display:grid;place-items:center;color:var(--muted);transition:all .2s;flex-shrink:0}
  .event-card-summary:hover .event-card-toggle{background:var(--primary-soft);color:var(--primary)}
  .event-card[open] .event-card-toggle{transform:translateY(-50%) rotate(180deg);
    background:var(--primary-soft);color:var(--primary)}
  .event-card-toggle svg{width:14px;height:14px}
  .event-card-hint{display:inline-flex;align-items:center;gap:4px;font-size:11px;
    color:var(--primary);font-weight:600;margin-top:8px;letter-spacing:.3px}
  .event-card[open] .event-card-hint{display:none}
  .event-card-hint svg{width:10px;height:10px;animation:bounce-y 1.4s ease-in-out infinite}
  @keyframes bounce-y{0%,100%{transform:translateY(0)} 50%{transform:translateY(2px)}}
  .event-status-tag{display:inline-block;padding:3px 10px;border-radius:6px;
    font-size:11px;font-weight:700;letter-spacing:.3px;line-height:1.4;margin-bottom:8px}
  .event-status-tag.active{background:#DCFCE7;color:#15803D}
  .event-status-tag.upcoming{background:#DBEAFE;color:#1D4ED8}
  .event-status-tag.expired{background:#F3F4F6;color:#6B7280}
  .event-card-meta h4{margin:0 0 6px;font-size:16px;font-weight:700;line-height:1.4}
  .event-period{font-size:12px;color:var(--muted);margin-bottom:10px;font-variant-numeric:tabular-nums}
  .event-summary-text{font-size:13px;color:var(--text);margin:0;line-height:1.6}

  /* ---------- Lightbox ---------- */

  /* ---------- Tracker FAB ---------- */

    .tracker-fab{padding:10px 14px;font-size:13px;bottom:16px;right:16px}

  }

  /* ---------- Empty state CTA ---------- */

</style>

<body>

<div class="lock-screen" id="lockScreen">
  <div class="lock-card">
    <div class="lock-logo">RC</div>
    <h2>客服查詢中心</h2>
    <p class="lock-sub">內部使用，請輸入存取密碼<br>有問題請聯繫 TONY</p>
    <input class="lock-input" id="lockInput" type="password" placeholder="密碼" autocomplete="off" autofocus>
    <button class="lock-btn" id="lockBtn">進入</button>
    <p class="lock-err" id="lockErr"></p>
  </div>
</div>
<script>
(function(){
  var AUTH_KEY = 'rcfaq-auth-v1';
  var HASH = '63e5dec4320a31100061b24f5f3afcbfeafb29edaf3c6fc849f439d827ea2f9e';
  var input = document.getElementById('lockInput');
  var btn   = document.getElementById('lockBtn');
  var err   = document.getElementById('lockErr');
  async function sha256(text){
    var buf = new TextEncoder().encode(text);
    var hb  = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hb))
      .map(function(b){return b.toString(16).padStart(2,'0');}).join('');
  }
  async function verify(){
    var pwd = (input.value || '').trim();
    if(!pwd){ err.textContent = '請輸入密碼'; return; }
    btn.disabled = true; err.textContent = '';
    var h = await sha256(pwd);
    if(h === HASH){
      try{ localStorage.setItem(AUTH_KEY, h); }catch(e){}
      document.documentElement.classList.remove('locked');
    } else {
      err.textContent = '密碼錯誤';
      btn.disabled = false;
      input.select();
    }
  }
  btn.addEventListener('click', verify);
  input.addEventListener('keydown', function(e){ if(e.key === 'Enter') verify(); });
  // 自動聚焦（autofocus 在 hidden 狀態可能失效）
  if(document.documentElement.classList.contains('locked')){
    setTimeout(function(){ input.focus(); }, 50);
  }
})();
</script>

  <div class="lb-caption" id="lbCaption"></div>

<script>
(function(){
  const $  = sel => document.querySelector(sel);
  const $$ = sel => Array.from(document.querySelectorAll(sel));
  const escapeHtml = s => String(s||'').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const highlight = (text, q) => {
    if(!q) return escapeHtml(text);
    const escaped = escapeHtml(text);
    const safeQ = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return escaped.replace(new RegExp(safeQ,'gi'), m => `<mark>${m}</mark>`);
  };

  let FAQS = null, SCREENS = null;
  let qaActiveCat = 'all', qaQuery = '';
  let flowActiveCat = 'all', flowQuery = '', flowSelectedId = null, flowMode = 'flow';

  // 取得一個步驟的所有圖片（向後相容：支援 images 陣列 或 image 單張）
  function getStepImages(s){
    if(s.images && Array.isArray(s.images) && s.images.length) return s.images.filter(Boolean);
    if(s.image) return [s.image];
    return [];
  }

  // ---- 同時載兩個 JSON ----
  Promise.all([
    fetch('data/faqs.json?_=' + Date.now()).then(r => r.ok ? r.json() : Promise.reject('faqs.json HTTP ' + r.status)),
    fetch('data/screens.json?_=' + Date.now()).then(r => r.ok ? r.json() : Promise.reject('screens.json HTTP ' + r.status))
  ]).then(([faqs, screens]) => {
    FAQS = faqs; SCREENS = screens;
    init();
  }).catch(err => {
    $('#qa-list').innerHTML =
      `<div class="empty"><h3>載入失敗</h3><p>${escapeHtml(String(err))}</p>
       <p style="font-size:12px">請確認此頁是用 http(s):// 開啟，而非直接 file:// 開。</p></div>`;
  });

  function init(){
    document.title = (FAQS.meta.siteTitle || 'RC 客服 QA');
    $('#lastUpdated').textContent = FAQS.meta.lastUpdated || '—';
    $('#meta').textContent = `QA ${FAQS.faqs.length} 筆 · 流程 ${SCREENS.flows.length} 條 · 更新：${FAQS.meta.lastUpdated || '—'}`;

    setupTrackerFAB();
    renderQuickLinks();
    initTabs();
    renderQAFilters(); renderQAList();
    renderFlowFilters(); renderFlowDetail(); renderFlowLibrary();
    renderEvents();

    $('#qa-search').addEventListener('input', e => { qaQuery = e.target.value.trim(); renderQAList(); });
    $('#flow-search').addEventListener('input', e => { flowQuery = e.target.value.trim();
      renderFlowFilters(); renderFlowDetail(); renderFlowLibrary(); });

    document.addEventListener('keydown', e => {
      if(e.key === '/' && document.activeElement.tagName !== 'INPUT'){
        e.preventDefault();
        const target = $('.panel.active').id === 'panel-qa' ? '#qa-search' : '#flow-search';
        $(target).focus();
      }
      if(!$('#lb').classList.contains('show')) return;
      if(e.key === 'Escape') closeLB();
      if(e.key === 'ArrowLeft')  { e.preventDefault(); navLB(-1); }
      if(e.key === 'ArrowRight') { e.preventDefault(); navLB(+1); }
    });

    $('#lb').addEventListener('click', closeLB);
    $('#lbClose').addEventListener('click', e => { e.stopPropagation(); closeLB(); });
    $('#lbPrev').addEventListener('click', e => { e.stopPropagation(); navLB(-1); });
    $('#lbNext').addEventListener('click', e => { e.stopPropagation(); navLB(+1); });
    // 點圖片本身不關閉（避免換頁時誤觸）
    $('#lbImg').addEventListener('click', e => e.stopPropagation());

    initLBSwipe();

    // 從 URL hash 設定初始 tab / faq
    handleHash();
    window.addEventListener('hashchange', handleHash);
  }

  // ============ Tracker Form FAB ============
  function setupTrackerFAB(){
    const url = (FAQS.meta && FAQS.meta.trackerFormUrl) || '';
    if(!url) return;
    const fab = $('#tracker-fab');
    fab.href = url;
    fab.classList.add('visible');
  }
  function trackerUrl(){
    return (FAQS && FAQS.meta && FAQS.meta.trackerFormUrl) || '';
  }
  function trackerLabel(){
    return (FAQS && FAQS.meta && FAQS.meta.trackerFormLabel) || '問題追蹤表單';
  }

  // ============ Quick Links Bar ============
  function renderQuickLinks(){
    const ql = FAQS.meta && FAQS.meta.quickLinks;
    const bar = $('#quickBar');
    if(!ql || (!ql.primary?.length && !ql.events?.length)){
      bar.hidden = true; return;
    }
    const today = new Date().toISOString().slice(0,10); // YYYY-MM-DD
    const sections = [];

    if(ql.primary?.length){
      sections.push(`
        <div class="quick-section">
          <span class="quick-label">主要入口</span>
          ${ql.primary.map(it => `
            <a class="quick-btn primary" href="${escapeHtml(it.url)}" target="_blank" rel="noopener">
              ${it.icon ? `<span class="quick-btn-icon">${escapeHtml(it.icon)}</span>` : ''}
              <span>${escapeHtml(it.label)}</span>
            </a>`).join('')}
        </div>`);
    }

    if(ql.events?.length){
      sections.push(`
        <div class="quick-section">
          <span class="quick-label">活動 / 功能</span>
          ${ql.events.map(it => {
            const expired = it.endDate && it.endDate < today;
            const tagType = expired ? 'expired' : (it.tagType || 'feature');
            const tagText = expired ? '已結束' : (it.tag || '');
            const period = (it.startDate || it.endDate)
              ? `<span class="quick-period">${escapeHtml(it.startDate||'')}${it.endDate?` ~ ${escapeHtml(it.endDate)}`:''}</span>` : '';
            return `
              <a class="quick-btn event ${expired?'is-expired':''}" href="${escapeHtml(it.url)}" target="_blank" rel="noopener">
                <span>${escapeHtml(it.label)}</span>
                <span class="quick-btn-meta">
                  ${tagText ? `<span class="quick-tag ${tagType}">${escapeHtml(tagText)}</span>` : ''}
                  ${period}
                </span>
              </a>`;
          }).join('')}
        </div>`);
    }

    // 兩個區塊之間插一條分隔
    const sep = sections.length === 2 ? '<div class="quick-divider"></div>' : '';
    bar.innerHTML = `<div class="quick-bar-inner">${sections[0] || ''}${sep}${sections[1] || ''}</div>`;
    bar.hidden = false;
  }

  // ============ TABS ============
  function initTabs(){
    $$('.tab').forEach(b => b.addEventListener('click', () => activateTab(b.dataset.tab)));
    $$('.mode-toggle button').forEach(b => b.addEventListener('click', () => {
      flowMode = b.dataset.mode;
      $$('.mode-toggle button').forEach(x => x.classList.toggle('active', x === b));
      $('#flows-flow-view').style.display = flowMode === 'flow' ? '' : 'none';
      $('#flows-library-view').style.display = flowMode === 'library' ? '' : 'none';
    }));
  }
  function activateTab(tab){
    $$('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    $$('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
  }
  function handleHash(){
    const h = (location.hash || '').replace('#','');
    if(!h) return;
    if(h.startsWith('faq=')){
      activateTab('qa');
      const id = h.slice(4);
      requestAnimationFrame(() => {
        const el = document.getElementById(id);
        if(el){
          el.open = true;
          el.classList.add('flash-target');
          el.scrollIntoView({behavior:'smooth', block:'start'});
          setTimeout(() => el.classList.remove('flash-target'), 2400);
        }
      });
    } else if(h === 'flows'){
      activateTab('flows');
    } else if(h.startsWith('flow=')){
      activateTab('flows');
      flowSelectedId = h.slice(5);
      renderFlowDetail();
    } else if(h === 'event' || h === 'events'){
      activateTab('event');
    }
  }

  // ============ QA TAB ============
  function renderQAFilters(){
    const counts = {all: FAQS.faqs.length};
    FAQS.categories.forEach(c => counts[c.id] = 0);
    FAQS.faqs.forEach(f => { if(counts[f.category] !== undefined) counts[f.category]++; });

    const html = [`<div class="chip ${qaActiveCat==='all'?'active':''}" data-cat="all">
        全部 <span class="chip-count">${counts.all}</span></div>`];
    FAQS.categories.forEach(c => {
      if(counts[c.id] === 0) return;
      html.push(`<div class="chip ${qaActiveCat===c.id?'active':''}" data-cat="${c.id}">
        <span class="chip-dot" style="background:${c.color}"></span>
        ${escapeHtml(c.name)} <span class="chip-count">${counts[c.id]}</span></div>`);
    });
    $('#qa-filters').innerHTML = html.join('');
    $('#qa-filters').querySelectorAll('.chip').forEach(el => {
      el.addEventListener('click', () => { qaActiveCat = el.dataset.cat; renderQAFilters(); renderQAList(); });
    });
  }
  function qaMatches(faq, q){
    if(!q) return true;

      (faq.tags||[]).join(' '), (faq.csSteps||[]).join(' '), faq.id].join(' ').toLowerCase();
    return q.toLowerCase().split(/\s+/).filter(Boolean).every(t => hay.includes(t));

  function renderQAList(){

  function renderFaq(f, c, opts){
    opts = opts || {};
    const setId = opts.setId !== false;
    const hl = opts.skipHighlight ? (t => escapeHtml(t||'')) : (t => highlight(t, qaQuery));
    const catColor = c ? c.color : '#7F8C8D';

      ? `<div class="tags">${f.tags.map(t => `<span class="tag">#${escapeHtml(t)}</span>`).join('')}</div>` : '';

      ? `<div class="images">${f.images.map(src =>
          `<img src="${escapeHtml(src)}" data-full="${escapeHtml(src)}" data-cap="${escapeHtml(f.title)}" alt="" loading="lazy">`).join('')}</div>` : '';
    return `
    <details class="faq"${setId ? ` id="${escapeHtml(f.id)}"` : ''}>

        <span class="faq-cat" style="background:${catColor}">${escapeHtml(catName)}</span>

        <span class="faq-id">${escapeHtml(f.id)}</span>
        <svg class="faq-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

        ${f.rootCause ? `<div class="field"><div class="field-label">問題原因</div>
          <div class="field-value">${hl(f.rootCause)}</div></div>` : ''}

        ${f.replyTemplate ? `<div class="field"><div class="field-label">建議回覆話術</div>
          <div class="reply-box" id="reply-${escapeHtml(f.id)}">${escapeHtml(f.replyTemplate)}<button class="copy-btn" data-target="${escapeHtml(f.id)}">📋 複製</button></div>

        ${tagsHtml}

  function bindFaqEvents(){
    $$('.copy-btn').forEach(btn => {

  // 綁定每個 carousel：滑動時更新頁碼跟 dots、按鈕可前後切換
  function bindCarousels(){
    $$('.step-carousel').forEach(car => {
      const track = car.querySelector('.step-carousel-track');
      const total = +car.dataset.total;
      const dots = Array.from(car.querySelectorAll('.step-carousel-dot'));
      const counterEl = car.querySelector('.step-carousel-current');
      const prevBtn = car.querySelector('.step-carousel-arrow.prev');
      const nextBtn = car.querySelector('.step-carousel-arrow.next');
      if(total <= 1) return;

      function update(){
        const idx = Math.round(track.scrollLeft / track.clientWidth);
        if(counterEl) counterEl.textContent = String(idx + 1);
        dots.forEach((d, j) => d.classList.toggle('active', j === idx));
        if(prevBtn) prevBtn.disabled = idx <= 0;
        if(nextBtn) nextBtn.disabled = idx >= total - 1;
      }
      track.addEventListener('scroll', () => requestAnimationFrame(update), {passive:true});

      dots.forEach((d, j) => d.addEventListener('click', e => {
        e.stopPropagation();
        track.scrollTo({left: j * track.clientWidth, behavior:'smooth'});
      }));
      if(prevBtn) prevBtn.addEventListener('click', e => {
        e.stopPropagation();
        const idx = Math.round(track.scrollLeft / track.clientWidth);
        track.scrollTo({left: Math.max(0, (idx-1)) * track.clientWidth, behavior:'smooth'});
      });
      if(nextBtn) nextBtn.addEventListener('click', e => {
        e.stopPropagation();
        const idx = Math.round(track.scrollLeft / track.clientWidth);
        track.scrollTo({left: Math.min(total-1, (idx+1)) * track.clientWidth, behavior:'smooth'});
      });
      update();
    });
  }

  function renderFlowLibrary(){

  // ============ Event Panel ============
  function renderEvents(){
    const events = (FAQS.meta && FAQS.meta.events) || [];
    const tabBtn = $('#tab-event');
    if(!events.length){
      tabBtn.hidden = true;
      $('#event-empty').hidden = false;
      return;
    }
    tabBtn.hidden = false;
    $('#event-empty').hidden = true;

    const today = new Date().toISOString().slice(0, 10);
    const status = e => {
      if(e.startDate && e.startDate > today) return 'upcoming';
      if(e.endDate && e.endDate < today) return 'expired';
      return 'active';
    };
    const sortKey = e => e.startDate || '';
    const byStatus = {active: [], upcoming: [], expired: []};
    events.forEach(e => byStatus[status(e)].push(e));
    byStatus.active.sort((a,b) => sortKey(b).localeCompare(sortKey(a)));
    byStatus.upcoming.sort((a,b) => sortKey(a).localeCompare(sortKey(b)));
    byStatus.expired.sort((a,b) => sortKey(b).localeCompare(sortKey(a)));

    const labels = {active:'進行中', upcoming:'即將開始', expired:'已結束'};
    const sections = [];
    ['active','upcoming','expired'].forEach(s => {
      if(!byStatus[s].length) return;
      sections.push(`<h3 class="event-section-title">${labels[s]}（${byStatus[s].length}）</h3>`);
      byStatus[s].forEach(e => sections.push(renderEventCard(e, s)));
    });
    $('#event-list').innerHTML = sections.join('');
    bindEventCardEvents();
  }

  function renderDetailSections(e){
    if(!e.detailSections || !e.detailSections.length) return '';
    const blocks = e.detailSections.map(sec => {
      let inner;
      if(sec.text){
        inner = `<p>${escapeHtml(sec.text)}</p>`;
      } else {
        inner = `<ul>${(sec.items || []).map(it => {
          const i = it.indexOf('｜');
          if(i > -1){
            return `<li class="has-chip"><span class="dchip">${escapeHtml(it.slice(0, i))}</span><span>${escapeHtml(it.slice(i + 1))}</span></li>`;
          }
          return `<li>${escapeHtml(it)}</li>`;
        }).join('')}</ul>`;
      }
      return `<div class="event-detail-block ${escapeHtml(sec.type || '')}">
        <div class="event-detail-h"><span class="ic">${escapeHtml(sec.icon || '')}</span>${escapeHtml(sec.label || '')}</div>
        ${inner}
      </div>`;
    }).join('');
    return `<div class="event-detail">${blocks}</div>`;
  }

  function renderEventCard(e, status){
    const labels = {active:'進行中', upcoming:'即將開始', expired:'已結束'};
    const isOpen = (status !== 'expired');
    const period = `${e.startDate || ''}${e.endDate ? ' ~ ' + e.endDate : ''}`;
    const banner = e.bannerImage
      ? `<img class="event-card-banner" src="${escapeHtml(e.bannerImage)}" data-full="${escapeHtml(e.bannerImage)}" data-cap="${escapeHtml(e.name)}" alt="${escapeHtml(e.name)}" loading="lazy">`
      : '';
    const detailHtml = renderDetailSections(e);

    // 對應 flow + faqs
    const flow = (SCREENS.flows || []).find(f => f.id === e.flowId);
    const faqMap = Object.fromEntries(FAQS.faqs.map(f => [f.id, f]));
    const cats = Object.fromEntries(FAQS.categories.map(c => [c.id, c]));
    const faqs = (e.faqIds || []).map(id => faqMap[id]).filter(Boolean);

    let flowHtml = '';
    if(flow){
      const stepsHtml = (flow.steps || []).map((s, i) => {
        const imgs = (s.images && s.images.length) ? s.images : (s.image ? [s.image] : []);
        const imgBlock = imgs.length
          ? `<div class="event-flow-step-img">${imgs.map(src =>
              `<img src="${escapeHtml(src)}" data-full="${escapeHtml(src)}" data-cap="${escapeHtml(e.name + ' / ' + s.title)}" alt="" loading="lazy">`).join('')}</div>`
          : `<div class="event-flow-step-img"><div class="event-flow-step-img-empty">尚未上傳截圖</div></div>`;
        return `<div class="event-flow-step">
          ${imgBlock}
          <div class="event-flow-step-body">
            <h6 class="event-flow-step-title">${escapeHtml(s.title)}</h6>
            <p class="event-flow-step-desc">${escapeHtml(s.description || '')}</p>
          </div>
        </div>`;
      }).join('');
      flowHtml = `<div class="event-section-h">活動流程</div>${stepsHtml}`;
    }

    const faqsHtml = faqs.length
      ? `<div class="event-section-h">常見異議 QA（${faqs.length}）</div>
         <div class="event-faqs">${faqs.map(f => renderFaq(f, cats[f.category], {setId: false, skipHighlight: true})).join('')}</div>`
      : '';

    const chevronSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`;
    const hintHtml = isOpen ? '' : `<span class="event-card-hint">點擊展開完整流程與 QA ${chevronSvg}</span>`;

    return `<details class="event-card ${status}" ${isOpen ? 'open' : ''}>
      <summary class="event-card-summary">
        ${banner}
        <div class="event-card-meta">
          <span class="event-status-tag ${status}">${labels[status]}</span>
          <h4>${escapeHtml(e.name)}</h4>
          <div class="event-period">${escapeHtml(period)}</div>
          <p class="event-summary-text">${escapeHtml(e.tagline || e.summary || '')}</p>
          ${hintHtml}
        </div>
        <span class="event-card-toggle" aria-hidden="true">${chevronSvg}</span>
      </summary>
      <div class="event-card-body">
        ${detailHtml}
        ${flowHtml}
        ${faqsHtml}
      </div>
    </details>`;
  }

          ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        }
        btn.classList.add('copied');

    $$('#panel-event .event-card-summary').forEach(s => {
      s.addEventListener('click', e => {
        if(e.target.closest('img[data-full]')){ e.preventDefault(); }
      });
    });
  }

  // ============ Lightbox ============
  // state: 一組可左右切換的圖片
  let lbItems = [];   // [{src, cap}]
  let lbIdx   = 0;

  // 從點到的 img 推回「同組圖片」：
  //  - 同一 step 的 carousel-track 內所有 img
  //  - 同一 FAQ 卡片 .images 內所有 img
  //  - 否則視為單張
  function gatherLBGroup(img){
    const container =
      img.closest('.step-carousel-track') ||
      img.closest('.images');
    const nodes = container
      ? Array.from(container.querySelectorAll('img[data-full]'))
      : [img];
    const items = nodes.map(n => ({
      src: n.dataset.full || n.src,
      cap: n.dataset.cap || ''
    }));
    const idx = Math.max(0, nodes.indexOf(img));
    return {items, idx};
  }

  function openLBFromImg(img){
    const {items, idx} = gatherLBGroup(img);
    openLBGroup(items, idx);
  }

  function openLBGroup(items, startIdx){
    if(!items || !items.length) return;
    lbItems = items;
    lbIdx = Math.min(Math.max(0, startIdx|0), items.length - 1);
    const lb = $('#lb');
    lb.classList.toggle('has-multi', items.length > 1);
    lb.classList.add('show');
    renderLB();
  }

  function renderLB(){
    const it = lbItems[lbIdx];
    if(!it) return;
    const img = $('#lbImg');
    img.style.transform = '';
    img.src = it.src;
    $('#lbCaption').textContent = it.cap || '';
    $('#lbCounter').textContent = `${lbIdx + 1} / ${lbItems.length}`;
    $('#lbPrev').disabled = lbIdx <= 0;
    $('#lbNext').disabled = lbIdx >= lbItems.length - 1;
  }

  function navLB(delta){
    const next = lbIdx + delta;
    if(next < 0 || next >= lbItems.length) return;
    lbIdx = next;
    renderLB();
  }

  function closeLB(){
    const lb = $('#lb');
    lb.classList.remove('show');
    lb.classList.remove('has-multi');
    lb.classList.remove('swiping');
    $('#lbImg').src = '';
    $('#lbImg').style.transform = '';
    $('#lbCaption').textContent = '';
    $('#lbCounter').textContent = '';
    lbItems = []; lbIdx = 0;
  }

  // 觸控滑動切換（左右），垂直滑動則放行（不攔）
  function initLBSwipe(){
    const lb = $('#lb');
    const img = $('#lbImg');
    let sx=0, sy=0, dx=0, dy=0, tracking=false, locked=null;
    const THRESHOLD = 50;

    lb.addEventListener('touchstart', e => {
      if(!lb.classList.contains('show')) return;
      const t = e.changedTouches[0];
      sx = t.clientX; sy = t.clientY; dx = 0; dy = 0;
      tracking = true; locked = null;
    }, {passive:true});

    lb.addEventListener('touchmove', e => {
      if(!tracking) return;
      const t = e.changedTouches[0];
      dx = t.clientX - sx; dy = t.clientY - sy;
      if(locked === null && (Math.abs(dx) > 6 || Math.abs(dy) > 6)){
        locked = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
      }
      if(locked === 'h' && lbItems.length > 1){
        e.preventDefault();
        lb.classList.add('swiping');
        // 邊界阻尼
        let d = dx;
        if((lbIdx === 0 && d > 0) || (lbIdx === lbItems.length-1 && d < 0)) d = d * 0.3;
        img.style.transform = `translateX(${d}px)`;
      }
    }, {passive:false});

    lb.addEventListener('touchend', () => {
      if(!tracking) return;
      tracking = false;
      lb.classList.remove('swiping');
      img.style.transform = '';
      if(locked === 'h' && lbItems.length > 1){
        if(dx <= -THRESHOLD) navLB(+1);
        else if(dx >= THRESHOLD) navLB(-1);
      }
    });
  }
})();
</script>
</body>
</html>
